<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment - Smart Parking</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="brand">

        <div class="brand-icon">P</div>

        <div>
            <span class="brand-name">Smart Parking</span>
            <span class="brand-subtitle">Parking Management System</span>
        </div>

    </div>


    <div class="nav-links">

        <a href="/index.html">Home</a>
        <a href="/parking.html">Parking</a>
        <a href="/booking.html">Book Parking</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/admin.html">Admin</a>

    </div>

</nav>


<main class="page-container">

    <div class="page-heading">

        <div>

            <span class="eyebrow">PAYMENTS</span>

            <h1>Payment Management</h1>

            <p>
                Manage parking payment records.
            </p>

        </div>

    </div>


    <section class="form-card">

        <div class="form-card-header">

            <div class="form-icon payment-icon">
                ₹
            </div>

            <div>
                <h2>Make Payment</h2>
                <p>Enter payment details below.</p>
            </div>

        </div>


        <form onsubmit="createPayment(event)">

            <div class="form-row">

                <div class="form-group">

                    <label for="bookingId">
                        Booking ID
                    </label>

                    <input
                            type="number"
                            id="bookingId"
                            placeholder="Enter booking ID"
                            required>

                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            step="0.01"
                            required>

                </div>

            </div>


            <div class="form-group">

                <label for="paymentMethod">
                    Payment Method
                </label>

                <select id="paymentMethod" required>

                    <option value="">
                        Select payment method
                    </option>

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="CARD">
                        Card
                    </option>

                    <option value="CASH">
                        Cash
                    </option>

                </select>

            </div>


            <button type="submit" class="primary-btn full-btn">

                Complete Payment

            </button>

        </form>

    </section>


    <section class="content-card">

        <div class="card-heading">

            <div>
                <span class="eyebrow">HISTORY</span>
                <h2>Payment Records</h2>
            </div>

        </div>


        <div id="paymentList" class="record-list">

            <div class="loading-box">
                Loading payment records...
            </div>

        </div>

    </section>

</main>


<script src="/js/app.js"></script>

</body>
</html>
