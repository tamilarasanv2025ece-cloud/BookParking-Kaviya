<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Overstay - Smart Parking</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="brand">

        <div class="brand-icon">P</div>

        <div>
            <span class="brand-name">Smart Parking</span>
            <span class="brand-subtitle">Parking Management System</span>
        </div>

    </div>


    <div class="nav-links">

        <a href="/index.html">Home</a>
        <a href="/parking.html">Parking</a>
        <a href="/booking.html">Book Parking</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/overstay.html" class="active">Admin</a>

    </div>

</nav>


<main class="page-container">

    <div class="page-heading">

        <div>

            <span class="eyebrow">OVERSTAY</span>

            <h1>Overstay Management</h1>

            <p>
                Monitor and manage parking overstay penalties.
            </p>

        </div>

    </div>


    <section class="form-card">

        <div class="form-card-header">

            <div class="form-icon warning-icon">
                !
            </div>

            <div>
                <h2>Add Overstay Penalty</h2>
                <p>Record an overstay penalty for a booking.</p>
            </div>

        </div>


        <form onsubmit="createPenalty(event)">

            <div class="form-row">

                <div class="form-group">

                    <label for="penaltyBookingId">
                        Booking ID
                    </label>

                    <input
                            type="number"
                            id="penaltyBookingId"
                            placeholder="Enter booking ID"
                            required>

                </div>


                <div class="form-group">

                    <label for="penaltyAmount">
                        Penalty Amount
                    </label>

                    <input
                            type="number"
                            id="penaltyAmount"
                            placeholder="Enter penalty amount"
                            step="0.01"
                            required>

                </div>

            </div>


            <div class="form-group">

                <label for="reason">
                    Reason
                </label>

                <textarea
                        id="reason"
                        placeholder="Enter overstay reason"
                        rows="4"
                        required></textarea>

            </div>


            <button type="submit" class="primary-btn full-btn">

                Add Penalty

            </button>

        </form>

    </section>


    <section class="content-card">

        <div class="card-heading">

            <div>

                <span class="eyebrow">RECORDS</span>

                <h2>Penalty Records</h2>

            </div>

        </div>


        <div id="penaltyList" class="record-list">

            <div class="loading-box">
                Loading penalty records...
            </div>

        </div>

    </section>

</main>


<script src="/js/app.js"></script>

</body>
</html>
